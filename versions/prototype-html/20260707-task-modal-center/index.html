<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>新媒体矩阵运营工作台原型</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark">矩</div>
          <div>
            <strong>矩阵工作台</strong>
            <span>AI 内容运营</span>
          </div>
        </div>
        <nav class="nav" aria-label="主导航">
          <button class="nav-item active" data-view="home">
            <span class="nav-icon">⌂</span>
            <span>首页</span>
          </button>
          <button class="nav-item" data-view="accounts">
            <span class="nav-icon">▦</span>
            <span>账号矩阵</span>
          </button>
          <button class="nav-item" data-view="analytics">
            <span class="nav-icon">◌</span>
            <span>数据分析</span>
          </button>
          <button class="nav-item" data-view="creator">
            <span class="nav-icon">✎</span>
            <span>内容创作</span>
          </button>
          <div class="creator-subnav" id="creatorSubnav" aria-label="内容创作二级导航">
            <button class="subnav-item active" data-creator-step="title">标题确认</button>
            <button class="subnav-item" data-creator-step="article">生成文章</button>
            <button class="subnav-item" data-creator-step="image">生成图片</button>
            <button class="subnav-item" data-creator-step="layout">文章排版</button>
          </div>
          <button class="nav-item" data-view="drafts">
            <span class="nav-icon">▤</span>
            <span>草稿箱</span>
          </button>
          <button class="nav-item" data-view="tasks">
            <span class="nav-icon">□</span>
            <span>任务中心</span>
          </button>
          <button class="nav-item" data-view="settings">
            <span class="nav-icon">⚙</span>
            <span>系统设置</span>
          </button>
        </nav>
        <div class="sidebar-footer">
          <span>当前企业</span>
          <strong>好财 AI 运营组</strong>
        </div>
      </aside>

      <main class="main">
        <header class="topbar">
          <div>
            <p class="eyebrow">新媒体矩阵运营工作台</p>
            <h1 id="pageTitle">首页</h1>
          </div>
        </header>
        <section id="viewRoot" class="view-root" aria-live="polite"></section>
      </main>
    </div>

    <div id="drawer" class="drawer" aria-hidden="true">
      <div class="drawer-panel">
        <div class="drawer-header">
          <div>
            <p class="eyebrow" id="drawerEyebrow">账号详情</p>
            <h2 id="drawerTitle">账号详情</h2>
          </div>
          <button class="icon-button" data-action="close-drawer" title="关闭">×</button>
        </div>
        <div id="drawerBody" class="drawer-body"></div>
      </div>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
